<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Ciriaco</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para iconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="mobile-container">
        <!-- Encabezado con Logo y Subtítulo -->
        <header class="profile-header">
            <div class="logo-container">
                <svg class="restaurant-logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M50 15 C35 15, 30 30, 30 45 L30 75 L70 75 L70 45 C70 30, 65 15, 50 15 Z" />
                    <line x1="50" y1="15" x2="50" y2="25" />
                    <circle cx="50" cy="22" r="3" />
                    <!-- Icono interno simplificado de lámpara/cubiertos -->
                    <path d="M45 40 L55 40 L52 60 L48 60 Z" />
                </svg>
                <h1 class="brand-title">CASA<br>CIRIACO</h1>
            </div>
            <p class="brand-subtitle">COCINA TRADICIONAL MADRILEÑA CON SABOR CASERO</p>
        </header>

        <!-- Botones de Enlaces -->
        <nav class="links-nav">
            <a href="#" class="nav-button">Menú</a>
            <a href="#" class="nav-button">Ubicación</a>
            <a href="#" class="nav-button">Contacto</a>
            <a href="#" class="nav-button">Acerca de nosotros</a>
            <a href="#" class="nav-button">Galería</a>
            <a href="#" class="nav-button">Opiniones y reseñas</a>
        </nav>

        <!-- Redes Sociales -->
        <footer class="social-footer">
            <a href="#" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
        </footer>
    </main>

</body>
</html>
