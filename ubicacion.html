<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Ciriaco – Ubicación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ubicacion-style.css">
</head>
<body>

  <div class="phone-screen">

    <a href="index.html" class="back-link" aria-label="Volver al inicio">&larr;</a>

    <header class="page-header">
      <h1 class="page-title">Ubicación</h1>
      <p class="page-subtitle">Madrid de los Austrias, junto a la Plaza Mayor</p>
    </header>

    <div class="map-wrapper">
      <iframe
        title="Mapa Casa Ciriaco"
        src="https://maps.google.com/maps?q=Calle%20Mayor%2084%2C%2028013%20Madrid&z=16&output=embed"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <a href="https://maps.app.goo.gl/bUW6a2WkRYTaD5mT9?g_st=ic" target="_blank" rel="noopener" class="direction-btn">
      Cómo llegar
    </a>

    <section class="info-block">
      <h2 class="info-label">Dirección</h2>
      <p class="info-text">Calle Mayor, 84<br>28013 Madrid</p>
    </section>

    <section class="info-block">
      <h2 class="info-label">Horario</h2>
      <p class="info-text">
        13:00 – 16:00 h<br>
        20:00 – 24:00 h<br>
        <span class="info-note">Cierra domingos noche y lunes</span>
      </p>
    </section>

    <section class="info-block">
      <h2 class="info-label">Teléfono</h2>
      <p class="info-text"><a href="tel:+34915480620" class="info-link">91 548 06 20</a></p>
    </section>

    <section class="info-block">
      <h2 class="info-label">Cómo llegar</h2>
      <p class="info-text">
        Metro: líneas 1, 2 y 3 hasta Sol,<br>
        o líneas 2, 5 y Ramal hasta Ópera.
      </p>
    </section>

  </div>

</body>
</html>
