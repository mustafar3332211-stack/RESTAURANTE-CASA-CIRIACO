<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Casa Ciriaco</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para iconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="mobile-container">
        <!-- Encabezado con Logo y Subtítulo de la segunda imagen -->
        <header class="profile-header">
            <div class="logo-container menu-logo-layout">
                <svg class="restaurant-logo" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                    <!-- Arco de la puerta -->
                    <path d="M25 85 L25 40 C25 20, 75 20, 75 40 L75 85" />
                    <!-- Cubiertos dentro -->
                    <path d="M45 40 L45 70 M42 40 L42 55" />
                    <path d="M58 40 L58 70" />
                </svg>
                <div class="brand-text-group">
                    <h1 class="brand-title">CASA CIRIACO</h1>
                    <p class="brand-subtitle-menu">TRADICIÓN Y SOLERA DESDE 19XX</p>
                </div>
            </div>
        </header>

        <!-- Contenido del Menú -->
        <div class="menu-sections">
            <h2 class="menu-category-title">COMIDA Y ENSALADAS</h2>
            <nav class="links-nav menu-nav">
                <a href="#" class="nav-button">TAPAS</a>
                <a href="#" class="nav-button">RACIONES</a>
                <a href="#" class="nav-button">ENSALADAS</a>
                <a href="#" class="nav-button">ESPECIALIDADES</a>
                <a href="#" class="nav-button">POSTRES</a>
            </nav>

            <h2 class="menu-category-title">BEBIDAS</h2>
            <nav class="links-nav menu-nav">
                <a href="#" class="nav-button">BEBIDAS</a>
                <a href="#" class="nav-button">VINOS</a>
            </nav>
        </div>

        <!-- Redes Sociales (con TripAdvisor, Instagram y Facebook) -->
        <footer class="social-footer">
            <a href="#" class="social-icon" aria-label="TripAdvisor"><i class="fa-brands fa-tripadvisor"></i></a>
            <a href="#" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        </footer>
    </main>

</body>
</html>
