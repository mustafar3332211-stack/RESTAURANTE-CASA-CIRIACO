<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Casa Ciriaco</title>
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="container">
        <!-- Cabecera / Logo Menú -->
        <header class="header">
            <div class="logo-box">
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M25 85V40C25 25 37 15 50 15C63 15 75 25 75 40V85" />
                    <path d="M42 25V55" />
                    <path d="M58 25V45C58 48 56 50 58 55" />
                </svg>
            </div>
            <h1>CASA CIRIACO</h1>
            <p class="subtitle">TRADICIÓN Y SOLERA DESDE 19XX</p>
        </header>

        <!-- Secciones del Menú -->
        <section class="menu-section">
            <h2 class="section-title">COMIDA Y ENSALADAS</h2>
            <nav class="nav-menu">
                <a href="#tapas" class="btn">TAPAS</a>
                <a href="#raciones" class="btn">RACIONES</a>
                <a href="#ensaladas" class="btn">ENSALADAS</a>
                <a href="#especialidades" class="btn">ESPECIALIDADES</a>
                <a href="#postres" class="btn">POSTRES</a>
            </nav>
        </section>

        <section class="menu-section">
            <h2 class="section-title">BEBIDAS</h2>
            <nav class="nav-menu">
                <a href="#bebidas" class="btn">BEBIDAS</a>
                <a href="#vinos" class="btn">VINOS</a>
            </nav>
        </section>

        <!-- Footer con iconos diferentes de la primera -->
        <footer class="social-footer">
            <a href="#" aria-label="TripAdvisor"><i class="fa-brands fa-tripadvisor"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        </footer>
    </main>

</body>
</html>
