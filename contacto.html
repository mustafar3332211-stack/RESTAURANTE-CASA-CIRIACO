<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Ciriaco – Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="contacto-style.css">
</head>
<body>

  <div class="phone-screen">

    <a href="index.html" class="back-link" aria-label="Volver al inicio">&larr;</a>

    <header class="page-header">
      <h1 class="page-title">Contacto</h1>
      <p class="page-subtitle">Estaremos encantados de atenderte</p>
    </header>

    <section class="contact-list">

      <a href="tel:+34915480620" class="contact-card">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3f3f34" stroke-width="1.6">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.3 21 3 13.7 3 4.7c0-.6.4-1 1-1H7.4c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1L6.6 10.8z"/>
          </svg>
        </span>
        <span class="contact-text">
          <span class="contact-label">Teléfono</span>
          <span class="contact-value">91 548 06 20</span>
        </span>
      </a>

      <a href="mailto:info@casaciriaco.es" class="contact-card">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3f3f34" stroke-width="1.6">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 6.5 12 13l9-6.5"/>
          </svg>
        </span>
        <span class="contact-text">
          <span class="contact-label">Email</span>
          <span class="contact-value">info@casaciriaco.es</span>
        </span>
      </a>

      <a href="ubicacion.html" class="contact-card">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3f3f34" stroke-width="1.6">
            <path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z"/>
            <circle cx="12" cy="9.5" r="2.3"/>
          </svg>
        </span>
        <span class="contact-text">
          <span class="contact-label">Dirección</span>
          <span class="contact-value">Calle Mayor, 84 · Madrid</span>
        </span>
      </a>

    </section>

  </div>

</body>
</html>
